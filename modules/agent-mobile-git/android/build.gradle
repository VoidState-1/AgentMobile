plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.agentmobile'
version = '0.1.0'

android {
  namespace 'expo.modules.agentmobile.git'
  ndkVersion rootProject.ext.ndkVersion
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
    consumerProguardFiles 'consumer-rules.pro'
    testApplicationId 'com.agentmobile.git.validation'
    testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    externalNativeBuild {
      cmake {
        arguments '-DANDROID_STL=c++_shared', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
        abiFilters(*((findProperty('reactNativeArchitectures') ?: 'arm64-v8a,x86_64').split(',')))
      }
    }
  }
  externalNativeBuild {
    cmake {
      path '../CMakeLists.txt'
      version '3.22.1'
    }
  }
  buildFeatures { buildConfig true }
  packagingOptions { pickFirsts += ['**/libc++_shared.so'] }
}

dependencies {
  androidTestImplementation 'androidx.test:runner:1.7.0'
  androidTestImplementation 'androidx.test:core:1.7.0'
  androidTestImplementation 'junit:junit:4.13.2'
}
